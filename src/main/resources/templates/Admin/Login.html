<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metacam &mdash; Admin Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d0d;color:#e0e0e0;font-family:'Courier New',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{width:100%;max-width:400px;padding:2rem}
.logo{color:#00d4aa;font-size:1.75rem;font-weight:bold;letter-spacing:4px;text-align:center;margin-bottom:0.5rem}
.tagline{color:#555;text-align:center;font-size:0.75rem;letter-spacing:2px;margin-bottom:2.5rem}
.card{background:#141414;border:1px solid #1e1e1e;border-radius:12px;padding:2rem}
label{display:block;font-size:0.75rem;color:#888;letter-spacing:1px;margin-bottom:0.4rem;text-transform:uppercase}
input{width:100%;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:6px;padding:0.75rem 1rem;color:#e0e0e0;font-family:'Courier New',monospace;font-size:0.9rem;outline:none;transition:border-color 0.2s;margin-bottom:1.25rem}
input:focus{border-color:#00d4aa}
button{width:100%;background:#00d4aa;color:#0d0d0d;border:none;border-radius:6px;padding:0.85rem;font-family:'Courier New',monospace;font-size:0.9rem;font-weight:bold;letter-spacing:2px;cursor:pointer;transition:background 0.2s}
button:hover{background:#00b894}
.error{background:#1a0a0a;border:1px solid #5c1a1a;border-radius:6px;padding:0.75rem 1rem;color:#ff6b6b;font-size:0.8rem;margin-bottom:1.25rem;display:{{ErrorDisplay}}}
</style>
</head>
<body>
<div class="container">
  <div class="logo">METACAM</div>
  <div class="tagline">SECURITY AWARENESS TOOL</div>
  <div class="card">
    <div class="error">{{ErrorMessage}}</div>
    <form method="POST" action="/status/login">
      <label>Username</label>
      <input type="text" name="Username" autocomplete="off" autofocus>
      <label>Password</label>
      <input type="password" name="Password" autocomplete="off">
      <button type="submit">ACCESS PANEL</button>
    </form>
  </div>
</div>
</body>
</html>
